<main class="page">
  <h1 class="page-title">Pretraga proizvoda</h1>

  <section class="panel" aria-labelledby="pretraga-naslov">
    <h2 id="pretraga-naslov" class="visually-hidden">Forma za pretragu</h2>

    <form class="search" (ngSubmit)="pretrazi()">
      <div class="field">
        <label for="pretragaNaziv">Naziv proizvoda</label>
        <input
          class="input"
          id="pretragaNaziv"
          name="naziv"
          type="search"
          placeholder="npr. Hemijska olovka"
          [(ngModel)]="naziv"
        />
      </div>

      <div class="field">
        <label for="pretragaKategorija">Kategorija</label>
        <select class="input" id="pretragaKategorija" name="kategorija" [(ngModel)]="kategorija">
          <option value="">Sve kategorije</option>
          @for (k of kategorije; track k) {
            <option [value]="k">{{ k }}</option>
          }
        </select>
      </div>

      <button class="btn" type="submit">Pretraži</button>
    </form>

    <div class="table-wrap">
      <table class="table">
        <caption class="visually-hidden">Rezultati pretrage proizvoda</caption>
        <thead>
          <tr>
            <th scope="col" [attr.aria-sort]="ariaSort">
              <button type="button" class="sort-btn" (click)="promeniSortiranje()">
                Naziv proizvoda
                <span
                  class="sort-icon"
                  [class.sort-icon--asc]="sortSmer === 'rastuce'"
                  [class.sort-icon--desc]="sortSmer === 'opadajuce'"
                  aria-hidden="true"
                ></span>
              </button>
            </th>
            <th scope="col">Kategorija</th>
            <th scope="col">Štamparija</th>
            <th scope="col"><span class="visually-hidden">Detalji</span></th>
          </tr>
        </thead>
        <tbody>
          @for (p of rezultati; track p.id) {
            <tr>
              <td>{{ p.naziv }}</td>
              <td>{{ p.kategorija }}</td>
              <td>{{ p.stamparija }}</td>
              <td class="cell-action">
                <a class="btn btn--small" [routerLink]="['/klijent/proizvod', p.id]">DETALJI</a>
              </td>
            </tr>
          } @empty {
            <tr>
              <td class="table-empty" colspan="4">
                Nema proizvoda koji odgovaraju pretrazi. Promenite naziv ili izaberite drugu kategoriju.
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </section>
</main>
