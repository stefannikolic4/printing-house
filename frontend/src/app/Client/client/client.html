<div class="home">
  <header class="topbar topbar--menu">
    <a class="brand" routerLink="/klijent/profil">
      <svg class="regmark" viewBox="0 0 32 32" aria-hidden="true">
        <g fill="none" stroke-width="2">
          <g stroke="#e6007e" transform="translate(2 2)">
            <circle cx="14" cy="14" r="8" />
            <path d="M14 1v26M1 14h26" />
          </g>
          <g stroke="currentColor">
            <circle cx="14" cy="14" r="8" />
            <path d="M14 1v26M1 14h26" />
          </g>
        </g>
      </svg>
      <span>Printing House</span>
    </a>
 
    <nav class="menu" aria-label="Glavni meni">
      <a routerLink="/klijent/profil" routerLinkActive="menu-active">Profil</a>
      <a routerLink="/klijent/pretraga" routerLinkActive="menu-active">Pretraga proizvoda</a>
      <a routerLink="/klijent/korpa" routerLinkActive="menu-active">E-korpa</a>
      @if (jePravnoLice) {
        <a routerLink="/klijent/javne-nabavke" routerLinkActive="menu-active">Javne nabavke</a>
      }
      <a routerLink="/klijent/arhiva" routerLinkActive="menu-active">Arhiva proizvoda</a>
    </nav>
 
    <button type="button" class="link-btn" (click)="odjava()">Odjavi se</button>
  </header>
 
  <router-outlet />
</div>
